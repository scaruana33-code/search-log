name: Weekly job-search refresh

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC (~8-9am US Eastern)
  workflow_dispatch:        # lets you run it manually from the Actions tab
    inputs:
      lookback_days:
        description: "Days of Gmail to scan (use e.g. 90 to backfill)"
        default: "14"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Sync Gmail and email the summary
        run: python scripts/sync_gmail.py
        env:
          GOOGLE_CLIENT_ID: ${{ 175978392320-hs8u5fn8pp4d06tcok6jlo3722jchivn.apps.googleusercontent.com }}
          GOOGLE_CLIENT_SECRET: ${{ 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 }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '14' }}
      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/applications.json
          if ! git diff --cached --quiet; then
            git commit -m "Weekly refresh"
            git push
          fi
